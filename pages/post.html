<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yazı — Fikirhane</title>
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages/post.css" />
    <script type="module" src="/js/pages/post.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="logo" href="/">
          <img class="logo-mark" src="/assets/logo.svg" alt="" width="28" height="28" />
          Fikirhane
        </a>
        <nav class="site-nav" aria-label="Hesap" data-site-nav></nav>
      </div>
    </header>

    <main>
      <p id="post-message" class="page-message" role="status">Yazı yükleniyor…</p>

      <article id="post" class="post-page" hidden>
        <div id="post-alert" class="alert" role="alert" hidden></div>
        <img id="post-cover" class="post-cover" alt="" hidden />
        <header class="post-header">
          <div id="post-badges" class="post-card-badges"></div>
          <h1 id="post-title" class="post-title"></h1>
          <p id="post-meta" class="post-meta"></p>
          <div id="post-owner-actions" class="post-owner-actions" hidden>
            <a id="post-edit" class="btn btn-ghost btn-sm">Düzenle</a>
            <button id="post-delete" type="button" class="btn btn-danger btn-sm">Sil</button>
          </div>
        </header>
        <div id="post-content" class="prose"></div>
        <footer id="post-tags" class="post-tags" hidden>
          <ul class="tag-list"></ul>
        </footer>

        <div id="post-actions" class="post-actions" hidden>
          <button id="like-button" type="button" class="btn btn-ghost" aria-pressed="false">
            <span aria-hidden="true">♥</span> <span data-label>Beğen</span> <span data-count class="action-count">0</span>
          </button>
          <button id="bookmark-button" type="button" class="btn btn-ghost" aria-pressed="false">
            <span aria-hidden="true">🔖</span> <span data-label>Kaydet</span>
          </button>
          <button id="report-post" type="button" class="link-button" hidden>Şikâyet et</button>
          <button id="mod-remove-post" type="button" class="btn btn-danger btn-sm" hidden>
            Kaldır (moderasyon)
          </button>
          <span id="action-status" class="form-hint" role="status"></span>
        </div>

        <section id="comments" class="comments" aria-label="Yorumlar" hidden></section>
      </article>
    </main>

    <footer class="site-footer">
      <div class="container">© 2026 Fikirhane</div>
    </footer>
  </body>
</html>
